[project]
name = "ccr"
version = "0.1.0"
description = "Claude Context Reducer — token-efficient middleware for Claude Code"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CCR Team" }]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "mcp[cli]>=1.0.0",
]

[project.scripts]
ccr = "ccr.cli:cli"
ccr-mcp = "ccr.mcp_server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ccr", "ccr.*"]

[dependency-groups]
dev = ["ruff>=0.8.0", "pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
